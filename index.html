<!DOCTYPE html>
<html>
<head>
    <title>LMS API Test</title>
</head>
<body>
    <pre id="output">Загрузка...</pre>

    <script>
        fetch('https://lms.dvfu.ru/api/v2/members/current', {
            method: 'GET',
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
            document.getElementById('output').textContent = 'Ошибка: ' + error.message;
        });
    </script>
</body>
</html>
