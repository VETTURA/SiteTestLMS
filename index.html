<!DOCTYPE html>
<html>
<head>
    <title>Проверка ID через iframe</title>
    <style>
        iframe { width: 100%; height: 600px; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Проверка доступа</h1>
    
    <!-- Невидимый iframe для загрузки страницы LMS -->
    <iframe id="lmsFrame" src="https://lms.dvfu.ru" style="display: none;"></iframe>
    
    <div id="accessMessage">Проверка доступа...</div>

    <script>
    const iframe = document.getElementById('lmsFrame');
    
    console.log(iframe)

    iframe.onload = function() {
        try {
            // Пытаемся получить содержимое iframe
            const iframeContent = iframe.contentDocument || iframe.contentWindow.document;
            
            // Ищем div с ID
            const bodyHTML = iframeContent.body.innerHTML;
            const idMatch = bodyHTML.match(/ID:\s*(\d+)/);
            
            if (idMatch && idMatch[1]) {
                const userId = idMatch[1];
                document.getElementById('accessMessage').innerHTML = '✅ Доступ разрешен! ID: ' + userId;
                document.getElementById('content').classList.remove('hidden');
                
                // Отправляем ID на ваш сервер для логирования
                fetch('https://your-logging-server.com/log', {
                    method: 'POST',
                    body: JSON.stringify({user_id: userId, timestamp: new Date()})
                });
            } else {
                document.getElementById('accessMessage').innerHTML = '❌ ID не найден. Доступ запрещен.';
            }
        } catch (e) {
            document.getElementById('accessMessage').innerHTML = '❌ Ошибка доступа к iframe. Возможно, нужно войти в систему.';
        }
    };
    </script>
</body>
</html>
