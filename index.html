<!DOCTYPE html>
<html>
<head>
    <title>LMS API Test</title>
</head>
<body>
    <pre id="output">Загрузка...</pre>

    <script>
        async function getLMSData() {
            try {
                // Сначала заходим на главную страницу, чтобы получить куки и CSRF-токен
                await fetch('https://lms.dvfu.ru', {
                    method: 'GET',
                    credentials: 'include'
                });

                // Теперь делаем запрос к API
                const response = await fetch('https://lms.dvfu.ru/api/v2/members/current', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json',
                        'X-CSRF-Token': getCSRFToken() // Функция для получения токена из кук
                    }
                });

                const data = await response.json();
                document.getElementById('output').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('output').textContent = 'Ошибка: ' + error.message;
            }
        }

        // Функция для получения CSRF-токена из кук
        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'X-CSRF-TOKEN' || name === 'XSRF-TOKEN') {
                    return value;
                }
            }
            return '';
        }

        // Запускаем
        getLMSData();
    </script>
</body>
</html>
